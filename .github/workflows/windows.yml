name: Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install CMake
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Test Rust library
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri app
        run: bun tauri build --ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tucky-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: error

      - name: Attach installer only if the release already exists
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
              gh release upload $env:RELEASE_TAG $_.FullName --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            Write-Output "Mac release is not published yet; Windows installer remains available as an Actions artifact."
          }
          exit 0
