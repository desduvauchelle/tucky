name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, for example v0.1.1
        required: false
        type: string
      verify_only:
        description: Build and notarize artifacts without publishing a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tucky-macos-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Resolve version and preserve published releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/prepare-release.py

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    # Apple Silicon only. GitHub's Intel (macos-13) runners are being wound
    # down and repeatedly hung "awaiting a runner", freezing the whole release
    # (the publish job needs this build). Tucky ships aarch64-only.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Configure Apple signing and notarization
        env:
          TUCKY_APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.TUCKY_APPLE_CERTIFICATE_P12_BASE64 }}
          TUCKY_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.TUCKY_APPLE_CERTIFICATE_PASSWORD }}
          TUCKY_APPLE_ID: ${{ secrets.TUCKY_APPLE_ID }}
          TUCKY_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.TUCKY_APPLE_APP_SPECIFIC_PASSWORD }}
          TUCKY_APPLE_TEAM_ID: ${{ secrets.TUCKY_APPLE_TEAM_ID }}
        run: bash scripts/setup-ci-signing.sh

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: bun install

      - name: Bake version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 -c "
          import json, re, sys
          version = sys.argv[1]
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version):
              sys.exit('Invalid release version')
          with open('src-tauri/tauri.conf.json') as f:
              d = json.load(f)
          d['version'] = version
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(d, f, indent=2)
          with open('package.json') as f:
              package = json.load(f)
          package['version'] = version
          with open('package.json', 'w') as f:
              json.dump(package, f, indent=2)
          " "$VERSION"
          sed -i "" "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build syscap sidecar
        run: bash scripts/build-syscap.sh

      - name: Build screenrec sidecar
        run: bash scripts/build-screenrec.sh

      - name: Build and verify Apple-notarized app and DMG
        env:
          # Keep the existing public speech-model catalog.
          TUCKY_LOCAL_ASR: "0"
          VITE_LOCAL_ASR: "0"
        run: bun run release:mac

      - name: Verify MCP lifecycle and legacy executable path
        run: |
          python3 scripts/test-mcp-lifecycle.py src-tauri/target/release/bundle/macos/Tucky.app/Contents/MacOS/Tucky
          python3 scripts/test-mcp-lifecycle.py src-tauri/target/release/bundle/macos/Tucky.app/Contents/MacOS/echo-scribe

      - name: Install + first-launch smoke test
        # Runs the real install.sh against the tarball we just built, then
        # launches the installed app with ECHO_SCRIBE_SMOKE=1 and requires it
        # to self-report a rendered frontend + packaged sidecars. A failure
        # here blocks the release from publishing.
        run: bash scripts/smoke-test.sh "output/mac-release/Tucky-aarch64.tar.gz"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: |
            output/mac-release/Tucky-aarch64.tar.gz
            output/mac-release/EchoScribe-aarch64.tar.gz
            output/mac-release/Tucky-*.dmg
            output/mac-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tucky-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/tucky-signing.p12"

  release:
    needs: [prepare, build]
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Upload verified assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Tucky-*.tar.gz
            EchoScribe-*.tar.gz
            Tucky-*.dmg
            SHA256SUMS.txt

      - name: Verify every draft asset before publishing
        run: python3 scripts/verify-release-assets.py

      - name: Publish complete verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify published assets
        run: |
          # aarch64 is the only artifact — fail the release if it's missing.
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/EchoScribe-aarch64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Tucky-aarch64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Tucky-${RELEASE_TAG#v}-arm64.dmg"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Tucky-arm64.dmg"
